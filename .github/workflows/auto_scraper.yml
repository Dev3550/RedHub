name: ExoticHub Auto Scraper Cron

on:
  schedule:
    # Run every 4 minutes automatically to refresh old stream tokens & add latest videos
    - cron: '*/4 * * * *'
  push:
    # Trigger cloud scraping on every push to main
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Refresh Expired Stream Tokens (70 Parallel Scraper Workers)
        run: node --max-old-space-size=4096 refresh_catalog.js

      - name: Run 70-Worker Cluster Scraper
        run: node --max-old-space-size=4096 scraper_cluster.js

      - name: Regenerate Google Video Sitemap & Robots.txt
        run: node generate_sitemap.js

      - name: Commit and Push Updated Catalog & Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sample_videos.json checkpoint_urls.json sitemap.xml robots.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update video catalog, stream URLs & Google sitemap [skip ci]" && git push)
